name: Deploy InnovateFund

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
        env:
          VITE_CONTRACT_ADDRESS: "0x039B027e6DAC05Ccc3f2A38735e06fB71C9b589E"
          VITE_SEPOLIA_RPC_URL: "https://ethereum-sepolia-rpc.publicnode.com"
          VITE_DEPLOY_BLOCK: ""
          VITE_LOG_BLOCK_RANGE: "5000"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
